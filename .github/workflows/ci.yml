name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build python3 clang
      - run: make setup
      - run: make check test test-debug
      - run: make sanitize SANITIZER_CC=gcc OUTPUT=.build/gcc-sanitize.json
      - run: make sanitize SANITIZER_CC=clang OUTPUT=.build/clang-sanitize.json
      - run: make bench BENCH_SAMPLES=1 BENCH_ITERATIONS=1 OUTPUT=.build/bench-smoke.json
      - name: Prepare comparator Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Qualify pinned native comparators (no timing ranking)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          python3 bench/compare/build.py --goose .toolchain/goose/build/goose --output .build/comparison-build.json
          python3 bench/compare/qualify.py --build-record .build/comparison-build.json --output .build/comparison-qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: csv-validation
          path: .build/*.json
          include-hidden-files: true
          if-no-files-found: error
